name: Reproduce the same image over and over and over

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/repro-build/debian-12

jobs:
  local-build-analyze:
    name: ubuntu-${{ matrix.version }} / ${{ matrix.runtime }} / ${{ matrix.buildkit.desc }} /  ${{ matrix.arch.platforms }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "24.04"
          - "22.04"
        arch:
          - suffix: ""
            platforms: "linux/amd64,linux/arm64"
            digest: "sha256:fab23b1d46130ff2086e95f412c9604204bdff3b41d5ca0cacbe564887bb5075"
          - suffix: ""
            platforms: "linux/amd64"
            digest: "sha256:a9f7f1c5d23c1a6dd72146c060c7dc1cd640920f7ca2f4dc3114e1860d2e1176"
          - suffix: "-arm"
            platforms: "linux/arm64"
            digest: "sha256:237bf2285cdd9b7d64a16d58395f2b827aa8270f63ab1d77bfeda6687d0d36a2"
        buildkit:
          - image: "docker.io/moby/buildkit:v0.31.0@sha256:a095b3d11ce1a9a05b6064ef515dfca0291ec5bcf2ea8178da8f6461924294e1"
            desc: "Buildkit (v0.31.0)"
          - image: "docker.io/moby/buildkit:latest"
            desc: "Buildkit (latest)"
        runtime:
          - "docker"
          - "podman"
    runs-on: ubuntu-${{ matrix.version}}${{ matrix.arch.suffix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      ## `repro-build` emits OCI-layout tarballs, which the classic graphdriver
      ## store cannot load. Switch the daemon over before it is used for
      ## anything, since restarting it discards the images of the other store.
      #- name: Enable the containerd image store
      #  if: matrix.runtime == 'docker'
      #  run: |
      #    sudo mkdir -p /etc/docker
      #    echo '{"features": {"containerd-snapshotter": true}}' \
      #      | sudo tee /etc/docker/daemon.json
      #    sudo systemctl restart docker
      #    docker info -f '{{ .DriverStatus }}'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt update
          sudo apt install -y podman

      - name: Build image
        run: |
          sudo ./repro-build build  \
            --buildkit-image \
            ${{ matrix.buildkit.image }} \
            --source-date-epoch \
            1677619260 \
            --runtime \
            ${{ matrix.runtime }} \
            --platform \
            ${{ matrix.arch.platforms }} \
            -t \
            ${{ env.IMAGE_NAME }} \
            -f \
            Dockerfile.debian-12 \
            .

      - name: Verify digest
        run: |
          ./repro-build analyze \
            --show-contents \
            --expected-image-digest \
            ${{ matrix.arch.digest }} \
            image.tar

      - name: Make sure that tarball can be loaded
        run: ${{ matrix.runtime }} load -i image.tar

  actions-build:
    name: ubuntu-${{ matrix.version }} / repro-build GHA / ${{ matrix.buildkit.desc }}
    runs-on: ubuntu-${{ matrix.version}}${{ matrix.arch.suffix }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "24.04"
          - "22.04"
        arch:
          - suffix: ""
            platforms: "linux/amd64,linux/arm64"
            digest: "sha256:fab23b1d46130ff2086e95f412c9604204bdff3b41d5ca0cacbe564887bb5075"
          - suffix: ""
            platforms: "linux/amd64"
            digest: "sha256:a9f7f1c5d23c1a6dd72146c060c7dc1cd640920f7ca2f4dc3114e1860d2e1176"
          - suffix: "-arm"
            platforms: "linux/arm64"
            digest: "sha256:237bf2285cdd9b7d64a16d58395f2b827aa8270f63ab1d77bfeda6687d0d36a2"
        buildkit:
          - image: "docker.io/moby/buildkit:v0.31.0@sha256:a095b3d11ce1a9a05b6064ef515dfca0291ec5bcf2ea8178da8f6461924294e1"
            desc: "Buildkit (v0.31.0)"
            short: bk0.31.0
          - image: "docker.io/moby/buildkit:latest"
            desc: "Buildkit (latest)"
            short: bkl
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image name
        id: image
        run: |
          date=$(date +'%Y%m%d')
          tag="${date}-${{ matrix.version }}-${{ matrix.buildkit.short }}-${RANDOM}"
          name=${{ env.IMAGE_NAME }}:${tag}
          echo "Will use image name: ${name}"
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Build image
        id: build
        uses: ./
        with:
          tags: ${{ steps.image.outputs.name }}
          file: Dockerfile.debian-12
          platforms: ${{ matrix.arch.platforms }}
          buildkit_image: ${{ matrix.buildkit.image }}
          source_date_epoch: 1677619260
          push: true
          cache: true

      - name: Verify digest
        run: |
          docker buildx imagetools inspect ${{ steps.image.outputs.name }}
          digest=${{ steps.build.outputs.digest }}
          echo "Digest is: ${digest}"
          echo "Expected: ${{ matrix.arch.digest }}"
          [[ "$digest" = "${{ matrix.arch.digest }}" ]]

  actions-verify:
    name: ubuntu-${{ matrix.version }} / repro-build/verify GHA / ${{ matrix.buildkit.desc }}
    runs-on: ubuntu-${{ matrix.version}}${{ matrix.arch.suffix }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "24.04"
          - "22.04"
        arch:
          - suffix: ""
            platforms: "linux/amd64,linux/arm64"
            digest: "sha256:fab23b1d46130ff2086e95f412c9604204bdff3b41d5ca0cacbe564887bb5075"
          - suffix: ""
            platforms: "linux/amd64"
            digest: "sha256:a9f7f1c5d23c1a6dd72146c060c7dc1cd640920f7ca2f4dc3114e1860d2e1176"
          - suffix: "-arm"
            platforms: "linux/arm64"
            digest: "sha256:237bf2285cdd9b7d64a16d58395f2b827aa8270f63ab1d77bfeda6687d0d36a2"
        buildkit:
          - image: "docker.io/moby/buildkit:v0.31.0@sha256:a095b3d11ce1a9a05b6064ef515dfca0291ec5bcf2ea8178da8f6461924294e1"
            desc: "Buildkit (v0.31.0)"
            short: bk0.31.0
          - image: "docker.io/moby/buildkit:latest"
            desc: "Buildkit (latest)"
            short: bkl
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Verify image
        uses: ./verify
        with:
          file: Dockerfile.debian-12
          expected_digest: ${{ matrix.arch.digest }}
          platforms: ${{ matrix.arch.platforms }}
          source_date_epoch: 1677619260
          buildkit_image: ${{ matrix.buildkit.image }}
          runtime: podman
