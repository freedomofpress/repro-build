name: Reproduce the same image over and over and over

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/repro-build/debian-12
  DIGEST_MULTI: sha256:a9f7f1c5d23c1a6dd72146c060c7dc1cd640920f7ca2f4dc3114e1860d2e1176
  DIGEST_AMD64: sha256:a9f7f1c5d23c1a6dd72146c060c7dc1cd640920f7ca2f4dc3114e1860d2e1176
  DIGEST_ARM64: sha256:a9f7f1c5d23c1a6dd72146c060c7dc1cd640920f7ca2f4dc3114e1860d2e1176
  BUILDKIT_IMAGE_REF: docker.io/moby/buildkit:v0.31.0@sha256:a095b3d11ce1a9a05b6064ef515dfca0291ec5bcf2ea8178da8f6461924294e1
  BUILDKIT_DESC_REF: Buildkit (v0.31.0)
  BUILDKIT_IMAGE_LATEST: docker.io/moby/buildkit:latest
  BUILDKIT_DESC_LATEST : Buildkit (latest)

jobs:
  local-build-analyze:
    name: ubuntu-${{ matrix.version }} / ${{ matrix.runtime }} / ${{ matrix.buildkit.desc }} /  ${{ matrix.arch.platforms }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "24.04"
          - "22.04"
        arch:
          - suffix: ""
            platforms: "linux/amd64,linux/arm64"
            digest: ${{ env.DIGEST_MULTI }}
          - suffix: ""
            platforms: "linux/amd64"
            digest: ${{ env.DIGEST_AMD64 }}
          - suffix: "-arm"
            platforms: "linux/arm64"
            digest: ${{ env.DIGEST_ARM64 }}
        buildkit:
          - image: ${{ env.BUILDKIT_IMAGE_REF }}
            desc: ${{ env.BUILDKIT_DESC_REF }}
          - image: ${{ env.BUILDKIT_IMAGE_LATEST }}
            desc: ${{ env.BUILDKIT_DESC_LATEST }}
        runtime:
          - "docker"
          - "podman"
    runs-on: ubuntu-${{ matrix.version}}${{ matrix.arch.suffix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt update
          sudo apt install -y podman

      - name: Build image
        run: |
          sudo ./repro-build build  \
            --buildkit-image \
            ${{ matrix.buildkit.image }} \
            --source-date-epoch \
            1677619260 \
            --runtime \
            ${{ matrix.runtime }} \
            --platform \
            {{ matrix.arch.platforms }} \
            -t \
            ${{ env.IMAGE_NAME }} \
            -f \
            Dockerfile.debian-12 \
            .

      - name: Verify digest
        run: |
          ./repro-build analyze \
            --show-contents \
            --expected-image-digest \
            ${{ matrix.arch.digest }} \
            image.tar

  actions-build:
    name: ubuntu-${{ matrix.version }} / repro-build GHA / ${{ matrix.buildkit.desc }}
    runs-on: ubuntu-${{ matrix.version}}${{ matrix.arch.suffix }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "24.04"
          - "22.04"
        arch:
          - suffix: ""
            platforms: "linux/amd64,linux/arm64"
            digest: ${{ env.DIGEST_MULTI }}
          - suffix: ""
            platforms: "linux/amd64"
            digest: ${{ env.DIGEST_AMD64 }}
          - suffix: "-arm"
            platforms: "linux/arm64"
            digest: ${{ env.DIGEST_ARM64 }}
        buildkit:
          - image: ${{ env.BUILDKIT_IMAGE_REF }}
            desc: ${{ env.BUILDKIT_DESC_REF }}
            short: bk0.31.0
          - image: ${{ env.BUILDKIT_IMAGE_LATEST }}
            desc: ${{ env.BUILDKIT_DESC_LATEST }}
            short: bkl
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image name
        id: image
        run: |
          date=$(date +'%Y%m%d')
          tag="${date}-${{ matrix.version }}-${{ matrix.buildkit.short }}-${RANDOM}"
          name=${{ env.IMAGE_NAME }}:${tag}
          echo "Will use image name: ${name}"
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Build image
        uses: ./
        with:
          tags: ${{ steps.image.outputs.tag }}
          file: Dockerfile.debian-12
          platforms: ${{ matrix.platforms }}
          buildkit_image: ${{ matrix.buildkit.image }}
          source_date_epoch: 1677619260
          runtime: docker
          push: true
          cache: true

      - name: Verify digest
        run: |
          docker buildx imagetools inspect ${{ steps.image.outputs.tag }}
          digest=$(docker buildx imagetools inspect ${{ steps.image.outputs.tag }} --format "{{json .Manifest}}" | jq -r '.digest')
          echo "Digest is: ${digest}"
          echo "Expected: ${{ matrix.arch.digest }}"
          [[ "$digest" = "${{ matrix.arch.digest }}" ]]

  actions-verify:
    name: ubuntu-${{ matrix.version }} / repro-build/verify GHA / ${{ matrix.buildkit.desc }}
    runs-on: ubuntu-${{ matrix.version}}${{ matrix.arch.suffix }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "24.04"
          - "22.04"
        arch:
          - suffix: ""
            platforms: "linux/amd64,linux/arm64"
            digest: ${{ env.DIGEST_MULTI }}
          - suffix: ""
            platforms: "linux/amd64"
            digest: ${{ env.DIGEST_AMD64 }}
          - suffix: "-arm"
            platforms: "linux/arm64"
            digest: ${{ env.DIGEST_ARM64 }}
        buildkit:
          - image: ${{ env.BUILDKIT_IMAGE_REF }}
            desc: ${{ env.BUILDKIT_DESC_REF }}
            short: bk0.31.0
          - image: ${{ env.BUILDKIT_IMAGE_LATEST }}
            desc: ${{ env.BUILDKIT_DESC_LATEST }}
            short: bkl
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Verify image
        uses: ./verify
        with:
          file: Dockerfile.debian-12
          expected_digest: ${{ matrix.arch.digest }}
          platforms: ${{ matrix.platforms }}
          source_date_epoch: 1677619260
          buildkit_image: ${{ matrix.buildkit.image }}
          runtime: podman
