name: 'Reproduce and Verify'
description: 'Reproduce a container image and verify its digest using repro-build script'
inputs:
  expected_digest:
    description: 'Expected image index digest (e.g., sha256:...)'
    required: false
  target_image:
    description: 'Image to reproduce and verify (e.g., ghcr.io/org/repo:tag)'
    required: false
  file:
    description: 'Path to the Dockerfile'
    required: false
    default: 'Dockerfile'
  context:
    description: 'Build context'
    required: false
    default: '.'
  platforms:
    description: 'Target platforms (comma-separated, e.g., linux/amd64,linux/arm64). Must cover all platforms of the target image to verify its index digest.'
    required: false
    default: 'linux/amd64'
  buildkit_image:
    description: 'BuildKit image to use'
    required: false
    default: 'moby/buildkit:v0.31.0@sha256:a095b3d11ce1a9a05b6064ef515dfca0291ec5bcf2ea8178da8f6461924294e1'
  runtime:
    description: 'Container runtime (docker or podman)'
    required: false
    default: 'podman'
  source_date_epoch:
    description: 'SOURCE_DATE_EPOCH value'
    required: false
  build-args:
    description: 'Additional build arguments (comma-separated ARG=VALUE)'
    required: false
  output:
    description: 'Path to save the image tarball'
    required: false
    default: '/tmp/image.tar'
  tags:
    description: 'Tags for the image'
    required: false
  annotations:
    description: 'List of annotations to set'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Determine Digest
      id: digest
      shell: bash
      run: |
        if [[ -n "${{ inputs.expected_digest }}" ]]; then
          echo "value=${{ inputs.expected_digest }}" >> "$GITHUB_OUTPUT"
          echo "method=provided" >> "$GITHUB_OUTPUT"
        elif [[ -n "${{ inputs.target_image }}" ]]; then
          echo "method=crane" >> "$GITHUB_OUTPUT"
        else
          echo "Error: Either 'expected_digest' or 'target_image' must be provided."
          exit 1
        fi

    - name: Install Crane
      if: ${{ steps.digest.outputs.method == 'crane' }}
      uses: imjasonh/setup-crane@v0.4

    - name: Determine if target image is an index
      if: ${{ steps.digest.outputs.method == 'crane' }}
      id: index
      shell: bash
      run: |
        media_type=$(crane manifest "${{ inputs.target_image }}" | jq -r '.mediaType')
        echo "Target image media type: ${media_type}"
        if [[ "$media_type" == "application/vnd.oci.image.index.v1+json" \
           || "$media_type" == "application/vnd.docker.distribution.manifest.list.v2+json" ]]; then
          echo "is_index=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_index=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Fetch index digest with Crane
      if: ${{ steps.digest.outputs.method == 'crane' && steps.index.outputs.is_index == 'true' }}
      id: index_digest
      shell: bash
      run: |
        DIGEST=$(crane digest "${{ inputs.target_image }}")
        echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

    - name: Set final digest
      id: final
      shell: bash
      run: |
        if [[ "${{ steps.digest.outputs.method }}" == "provided" ]]; then
          echo "value=${{ steps.digest.outputs.value }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ steps.index.outputs.is_index }}" == "true" ]]; then
          echo "value=${{ steps.index_digest.outputs.value }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=" >> "$GITHUB_OUTPUT"
        fi

    - name: Reproduce image
      shell: bash
      run: |
        REPRO_SCRIPT="${{ github.action_path }}/../repro-build"
        # Split build_args by comma
        IFS=',' read -ra ADDR <<< "${{ inputs.build-args }}"
        BA_ARGS=()
        for i in "${ADDR[@]}"; do
          if [[ -n "$i" ]]; then
            BA_ARGS+=("--build-arg" "$i")
          fi
        done

        # Handle optional arguments
        BK_ARGS=()
        if [[ -n "${{ inputs.buildkit_image }}" ]]; then
            BK_ARGS+=("--buildkit-image" "${{ inputs.buildkit_image }}")
        fi

        SDE_ARGS=()
        if [[ -n "${{ inputs.source_date_epoch }}" ]]; then
             SDE_ARGS+=("--source-date-epoch" "${{ inputs.source_date_epoch }}")
        fi

        TAG_ARGS=()
        if [[ -n "${{ inputs.tags }}" ]]; then
            TAG_ARGS+=("-t" "${{ inputs.tags }}")
        fi

        ANNOTATION_ARGS=()
        IFS=',' read -ra ADDR <<< "${{ inputs.annotations }}"
        for i in "${ADDR[@]}"; do
          if [[ -n "$i" ]]; then
            ANNOTATION_ARGS+=("--annotation" "$i")
          fi
        done

        "$REPRO_SCRIPT" build \
          --runtime "${{ inputs.runtime }}" \
          "${BK_ARGS[@]}" \
          "${SDE_ARGS[@]}" \
          --platform "${{ inputs.platforms }}" \
          "${TAG_ARGS[@]}" \
          "${ANNOTATION_ARGS[@]}" \
          -f "${{ inputs.file }}" \
          -o "${{ inputs.output }}" \
          "${BA_ARGS[@]}" \
          "${{ inputs.context }}"

    - name: Verify digest
      if: ${{ steps.final.outputs.value != '' }}
      shell: bash
      run: |
        REPRO_SCRIPT="${{ github.action_path }}/../repro-build"
        "$REPRO_SCRIPT" analyze \
          --show-contents \
          --expected-image-digest "${{ steps.final.outputs.value }}" \
          "${{ inputs.output }}"

    - name: Verify per-platform digests
      if: ${{ steps.digest.outputs.method == 'crane' }}
      shell: bash
      run: |
        set -euo pipefail
        index_json="$(tar -xOf "${{ inputs.output }}" index.json 2>/dev/null || tar -xOf "${{ inputs.output }}" ./index.json)"
        IFS=',' read -ra PLATFORMS <<< "${{ inputs.platforms }}"
        for platform in "${PLATFORMS[@]}"; do
          platform="$(echo "$platform" | xargs)"
          [[ -n "$platform" ]] || continue
          remote="$(crane digest "${{ inputs.target_image }}" --platform "$platform" | cut -d: -f2)"
          IFS='/' read -ra P <<< "$platform"
          os="${P[0]}"
          arch="${P[1]}"
          local_digest="$(printf '%s' "$index_json" \
            | jq -r --arg os "$os" --arg arch "$arch" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest')"
          echo "Verifying digest for $platform: local=$local_digest remote=sha256:$remote"
          [[ "$local_digest" == "sha256:$remote" ]]
        done
